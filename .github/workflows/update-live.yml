name: Update Football Live Scores

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: football-live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update live scores
        run: python main.py

      - name: Verify generated files
        run: |
          echo "Generated JSON files:"
          find data -type f -name "*.json" -print

          if [ -z "$(find data -type f -name '*.json' -print -quit)" ]; then
            echo "ERROR: No JSON files generated"
            exit 1
          fi

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update football live scores"
            git push
          fi
