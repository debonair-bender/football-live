name: Test GitHub Cron

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

permissions:
  contents: read

jobs:
  test:
    name: Test Scheduled Execution
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Print execution information
        run: |
          echo "================================"
          echo "GITHUB ACTIONS CRON TEST"
          echo "================================"
          echo "UTC Time: $(date -u)"
          echo "Local Time: $(TZ=Europe/Rome date)"
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "================================"

      - name: Confirm success
        run: echo "TEST COMPLETED SUCCESSFULLY"
